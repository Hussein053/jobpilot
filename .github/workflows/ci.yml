name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: jobpilot_settings_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d jobpilot_settings_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test marketplace staging
        run: |
          fixture="$(mktemp -d)"
          claude="$fixture/claude"
          codex="$fixture/codex"
          mkdir -p "$claude/plugins/jobpilot" \
                   "$codex/plugins/jobpilot/.codex-plugin" \
                   "$codex/.agents/plugins"
          cat > "$codex/.agents/plugins/marketplace.json" <<'JSON'
          {
            "name": "sukhrob-codex-plugins",
            "interface": { "displayName": "Sukhrob Codex Plugins" },
            "plugins": [{
              "name": "jobpilot",
              "source": { "source": "local", "path": "./plugins/jobpilot" },
              "policy": { "installation": "AVAILABLE", "authentication": "ON_USE" },
              "category": "Productivity"
            }]
          }
          JSON

          # Equal size and mtime reproduces the old rsync false-negative.
          cp -p plugin/.codex-plugin/plugin.json "$codex/plugins/jobpilot/.codex-plugin/plugin.json"
          sed -i '0,/jobpilot/s//jobpilox/' "$codex/plugins/jobpilot/.codex-plugin/plugin.json"
          touch -r plugin/.codex-plugin/plugin.json "$codex/plugins/jobpilot/.codex-plugin/plugin.json"

          bash .github/scripts/sync-marketplaces.sh . "$claude" "$codex"
          cmp plugin/.codex-plugin/plugin.json "$codex/plugins/jobpilot/.codex-plugin/plugin.json"

      - name: Lint & format check
        run: bun run ci

      - name: Generate Prisma client
        run: bun run db:generate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # After db:generate: knip reads apps/api's imports of the generated client.
      - name: Dead code check
        run: bun run knip

      - name: Typecheck API
        run: bun run typecheck
        working-directory: apps/api

      # Unit tests keep DB access disabled; the isolated integration step opts in separately.
      - name: Test API
        run: bun run test
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          SECRET_MASTER_KEY: Y2ktdGVzdC1tYXN0ZXIta2V5LTMyLWJ5dGVzLWxvbmc=

      - name: Test contracts
        run: bun run test
        working-directory: packages/contracts

      - name: Migrate isolated fixture database
        run: bun run db:migrate:apply
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/jobpilot_settings_test

      - name: Test database races, approval, encryption, and preservation
        run: bun test src/modules/auto-apply/auto-apply.postgres.test.ts src/modules/ingestion/ingestion.postgres.test.ts src/modules/resume/review/resume-review.postgres.test.ts src/modules/information-bank/ src/modules/auto-apply/preview/
        working-directory: apps/api
        env:
          JOBPILOT_TEST_DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/jobpilot_settings_test
          STORAGE_ROOT: /tmp/jobpilot-fixture-storage

      - name: Check isolated fixture schema drift
        run: bun x prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/jobpilot_settings_test

      - name: Test web
        run: bun run test
        working-directory: apps/web

      - name: Typegen web
        run: bun run typegen
        working-directory: apps/web

      - name: Install fixture browser
        run: bun x playwright install --with-deps chromium --only-shell
        working-directory: apps/web

      - name: Test settings and offline privacy in fixture browser
        run: bun run test:e2e --max-failures=1
        working-directory: apps/web

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('apps/web/src/**', 'apps/web/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Build web
        run: bun run build
        working-directory: apps/web

  terminal:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-terminal-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test terminal host
        run: dotnet test -c Release

      # JIT reflection can hide missing JsonSerializable registrations, so publish one Native AOT RID.
      - name: Publish AOT (linux-x64)
        run: dotnet publish -c Release -r linux-x64 -o publish/
        working-directory: apps/terminal

      # InstallPaths.Resolve() requires the plugin tree; the host writes Codex's agents from plugin/agents/ at session start.
      - name: Verify publish root ships provider assets
        working-directory: apps/terminal/publish
        run: |
          for f in jobpilot \
                   plugin/.claude-plugin/plugin.json \
                   plugin/.codex-plugin/plugin.json \
                   plugin/.mcp.json \
                   plugin/skills/_shared/setup.md \
                   plugin/skills/auto-apply/SKILL.md \
                   plugin/agents/job-applier.md; do
            test -e "$f" || { echo "missing from publish root: $f"; exit 1; }
          done
          test ! -e .agents/plugins/marketplace.json || {
            echo "obsolete local Codex marketplace shipped in publish root"
            exit 1
          }
